# Tests on every push and PR; deploy only from main.
#
# Deploys are gated on the tests passing, which is the point: every deploy so
# far has been a manual `wrangler deploy` from a laptop, and the failures were
# environment problems (npx pulling a workerd build without its platform
# binary, running from the wrong directory) rather than bad code.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A container build takes minutes; never let two overlap on main.
  group: ci-${{ github.ref }}
  cancel-in-progress: false
  # Because runs are never superseded, a job that hangs blocks every push
  # behind it until someone notices. Each job below carries a timeout-minutes
  # for that reason — it is the only thing bounding a hang here.

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # matches containers/backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt pulls in requirements.txt and the test-only
          # packages. Installing a hand-listed subset here is what missed respx.
          pip install -r requirements-dev.txt
      - name: Test
        working-directory: backend
        env:
          # The router tests mock every HTTP call with respx, but the providers
          # refuse before the call when a key is absent — so on a machine with a
          # populated backend/.env they pass, and on a clean runner they did not.
          # These values are never sent anywhere.
          NVIDIA_NIM_API_KEY: ci-placeholder-respx-intercepts-the-request
          GROQ_API_KEY: ci-placeholder-respx-intercepts-the-request
          # The startup probe spawns MCP subprocesses and talks to them. The
          # suite needs none of that, and on this runner the process stopped
          # exiting after the tests passed — 15s became a 15m timeout, with an
          # orphaned python child killed at the end of the job.
          MCP_PROBE_ON_STARTUP: "false"
          # No DATABASE_URL on purpose: the repos fall back to their in-memory
          # store, which is what the accountability suite expects, and it means
          # CI can never touch production data.
        run: python -m pytest tests/ -q

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Wrangler requires >= 22, and the runners deprecated 20.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: https://monster-agent-backend.joelobafemii.workers.dev
        run: |
          npx next build
          npx @cloudflare/next-on-pages
      - uses: actions/upload-artifact@v4
        with:
          name: pages-bundle
          path: frontend/.vercel/output/static
          retention-days: 3

  worker-tests:
    # The Worker now carries the auth gate, and it used to deploy without a
    # typecheck or a single test. A regression in access.ts would have shipped
    # silently and looked exactly like a working deploy.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend-worker/package-lock.json
      - name: Install
        working-directory: backend-worker
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        working-directory: backend-worker
        run: npm run typecheck
      - name: Test
        working-directory: backend-worker
        run: npm test

  ingress-tests:
    # The ingress is the one component deliberately outside Access, so what it
    # refuses is load-bearing.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: telegram-ingress/package-lock.json
      - name: Install
        working-directory: telegram-ingress
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        working-directory: telegram-ingress
        run: npm run typecheck
      - name: Test
        working-directory: telegram-ingress
        run: npm test

  deploy-backend:
    needs: [backend-tests, frontend-build, worker-tests, ingress-tests]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Wrangler requires >= 22, and the runners deprecated 20.
          node-version: "22"
          cache: npm
          cache-dependency-path: backend-worker/package-lock.json
      - name: Install
        working-directory: backend-worker
        run: npm ci --legacy-peer-deps
      - name: Deploy worker + container
        working-directory: backend-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # The local install carries the right workerd binary for the runner,
        # so never invoke this through npx.
        run: ./node_modules/.bin/wrangler deploy

  deploy-ingress:
    # Needs deploy-backend: the DO class this binds to lives in that Worker, so
    # deploying this first would bind to a script that does not exist yet.
    needs: [deploy-backend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: telegram-ingress/package-lock.json
      - name: Install
        working-directory: telegram-ingress
        run: npm ci --legacy-peer-deps
      - name: Deploy ingress
        working-directory: telegram-ingress
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler deploy

  deploy-frontend:
    needs: [backend-tests, frontend-build, worker-tests, ingress-tests]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pages-bundle
          path: dist
      - uses: actions/setup-node@v4
        with:
          # Wrangler requires >= 22, and the runners deprecated 20.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          ./frontend/node_modules/.bin/wrangler pages deploy dist
          --project-name monster-agent-frontend --branch main --commit-dirty=true

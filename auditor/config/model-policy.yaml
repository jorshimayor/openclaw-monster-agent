# Stage -> model, with fallbacks. Models are config, never a code dependency:
# agent code speaks only the OpenAI chat-completions + tool-calling schema and
# the gateway translates. Swapping a provider must never touch agent logic.
#
# base_url points at your gateway — a self-hosted LiteLLM proxy, or
# https://openrouter.ai/api/v1. Both speak the same schema.

gateway:
  base_url: ${AUDITOR_GATEWAY_URL:-http://localhost:4000}
  api_key_env: AUDITOR_GATEWAY_KEY
  timeout_seconds: 180

stages:
  # The intellectual core: system modelling and invariant synthesis. Pay here.
  reasoning:
    primary: kimi-k2-thinking
    fallbacks: [claude-opus-4-1, deepseek-r1]
    temperature: 0.4

  # Writes and refines Foundry exploits against compiler and test output.
  poc_writing:
    primary: claude-sonnet-4-5
    fallbacks: [gpt-5-codex, kimi-k2-code]
    temperature: 0.1

  # Parsing tool JSON, deduping, formatting. Cheap and fast on purpose.
  mechanical:
    primary: gemini-2.5-flash
    fallbacks: [kimi-k2]
    temperature: 0.0

  # Writes up what survived. Prose quality matters; reasoning does not.
  reporting:
    primary: claude-sonnet-4-5
    fallbacks: [gpt-5]
    temperature: 0.3

# Different architectures fail differently, so a finding that survives three of
# them is far likelier to be real. These must not all be one family.
verifier_panel:
  - claude-opus-4-1
  - gpt-5
  - kimi-k2-thinking

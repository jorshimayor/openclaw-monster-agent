# Monster Agent Backend · Render Free Tier blueprint
# Docs: https://render.com/docs/infrastructure-as-code
# ONE-CLICK DEPLOY COMMIT: push this to `main`, then:
#   1. Visit https://dashboard.render.com/iac
#   2. Import repo → pick `render.yaml`
#   3. Add env vars marked `sync: false` in Render Dashboard → Environment
#
# FREE TIER LIMITS (Render):
#   · 750 hrs/month runtime (~always-on for 1 service)
#   · Spins down after 15 min idle → ~5-30s cold start wake-up
#   · 512 MB RAM / 0.1 CPU
#   · No custom domains on free (use onrender.com subdomain)

services:
  - type: web
    name: monster-agent-backend
    region: oregon
    runtime: python
    repo: https://github.com/jorshimayor/openclaw-monster-agent.git
    buildCommand: |
      cd backend
      python -m pip install --upgrade pip
      pip install poetry==1.8.5
      poetry config virtualenvs.create false
      poetry install --no-interaction --no-ansi --no-root
      pip install -e .
    startCommand: |
      cd backend
      python -m uvicorn src.api.main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 600 --timeout-graceful-shutdown 30
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    branch: main
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: NVIDIA_NIM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_DB_ID
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_USER_TOKEN
        sync: false
      - key: SLACK_CHANNEL
        value: "#agent-updates"
      - key: GOOGLE_WORKSPACE_CLIENT_ID
        sync: false
      - key: GOOGLE_WORKSPACE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_WORKSPACE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_WORKSPACE_SUBJECT_EMAIL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: HASHNODE_TOKEN
        sync: false
      - key: HASHNODE_PUBLICATION_ID
        sync: false
      - key: LLM_FALLBACK_ORDER
        value: '["nvidia_nim","groq"]'
      - key: BACKEND_CORS_ORIGINS
        value: '["http://localhost:3000","http://localhost:8080","https://monster-agent-frontend.vercel.app","https://monster-agent-frontend.pages.dev"]'
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "1"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
{{SURFACE}}
  <!-- X overlays the avatar on the bottom-left corner, so everything below
       y=340 stays right of x=440 and the left column sits high. -->
  <g fill="none" stroke="rgba(93,120,255,0.35)" stroke-width="1.5">
    <path d="M330 56 L330 96 Q330 114 348 114 L452 114"/>
    <path d="M1240 430 L1400 430 Q1418 430 1418 412 L1418 340"/>
  </g>
  <circle cx="330" cy="56" r="4" fill="#3D5AFE"/>
  <circle cx="1418" cy="340" r="4" fill="#3D5AFE"/>
  <rect x="120" y="54" width="150" height="80" fill="none"
        stroke="rgba(93,120,255,0.18)" stroke-width="1.5" stroke-dasharray="5 6"/>

  <!-- the cursor glyph from the original, sitting on the end of the trace -->
  <path d="M458 106 L476 114 L458 122 Z" fill="#E8ECF7"/>

  <text x="474" y="172" font-family="{{MONO}}" font-size="19" fill="#6E7893"
        letter-spacing="0.6" text-anchor="end">const profile = () =&gt;</text>

  <g font-family="{{SANS}}" font-size="46" font-weight="700">
    <text x="498" y="166" fill="#5B74FF">({</text>
    <text x="560" y="166">
      <tspan fill="#FFFFFF">{{KEY1A}}</tspan><tspan fill="#5B74FF">_{{KEY1B}}</tspan><tspan fill="#8A93AB">: </tspan><tspan fill="#6E7893">true</tspan>
    </text>
    <text x="560" y="246">
      <tspan fill="#FFFFFF">{{KEY2A}}</tspan><tspan fill="#5B74FF">_{{KEY2B}}</tspan><tspan fill="#8A93AB">: </tspan><tspan fill="#6E7893">true</tspan>
    </text>
    <text x="560" y="326">
      <tspan fill="#FFFFFF">{{KEY3A}}</tspan><tspan fill="#5B74FF">_{{KEY3B}}</tspan><tspan fill="#8A93AB">: </tspan><tspan fill="#6E7893">true</tspan><tspan fill="#5B74FF"> })</tspan>
    </text>
  </g>

  <!-- url badges -->
  <g transform="translate(560,396)">
    <circle cx="16" cy="16" r="15" fill="none" stroke="rgba(232,236,247,0.75)" stroke-width="1.6"/>
    <path d="M1 16 H31 M16 1 a20 20 0 0 1 0 30 a20 20 0 0 1 0 -30" fill="none"
          stroke="rgba(232,236,247,0.75)" stroke-width="1.4"/>
    <text x="44" y="22" font-family="{{MONO}}" font-size="18" fill="#FFFFFF" letter-spacing="0.4">{{SITE}}</text>
  </g>
  <g transform="translate(940,396)">
    <rect x="6" y="6" width="20" height="20" rx="3" transform="rotate(45 16 16)"
          fill="none" stroke="rgba(232,236,247,0.75)" stroke-width="1.6"/>
    <text x="44" y="22" font-family="{{MONO}}" font-size="18" fill="#FFFFFF" letter-spacing="0.4">{{SECONDARY}}</text>
  </g>
</svg>

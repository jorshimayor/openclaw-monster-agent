<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
{{SURFACE}}
{{MOTIF}}
  <g fill="none" stroke="rgba(93,120,255,0.3)" stroke-width="1.5">
    <path d="M980 64 L1104 64 Q1122 64 1122 82 L1122 140"/>
  </g>
  <circle cx="1122" cy="140" r="4" fill="#3D5AFE"/>

  <g transform="translate(72,64) scale(0.5)">
    <rect width="96" height="96" rx="20" fill="#0C1124" stroke="rgba(93,120,255,0.22)" stroke-width="1.5"/>
    {{MARK}}
  </g>
  <text x="132" y="100" font-family="{{MONO}}" font-size="20" fill="#FFFFFF" letter-spacing="0.4">{{NEWSLETTER}}</text>
  <text x="1128" y="100" font-family="{{MONO}}" font-size="18" fill="#6E7893"
        text-anchor="end" letter-spacing="2">{{ISSUE}} · {{DATE}}</text>
  <line x1="72" y1="132" x2="1128" y2="132" stroke="rgba(93,120,255,0.2)" stroke-width="1.5"/>

  <g font-family="{{SANS}}" font-weight="700" font-size="{{TITLESIZE}}" fill="#FFFFFF" letter-spacing="-1">
    <text x="72" y="214">{{LINE1}}</text>
    <text x="72" y="{{Y2}}" fill="#A5B2FF">{{LINE2}}</text>
  </g>
  <text x="72" y="340" font-family="{{MONO}}" font-size="20" fill="#6E7893">{{SUBTITLE}}</text>
</svg>

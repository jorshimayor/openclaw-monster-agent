<!-- Horizontal lockup. Wordmark in mono to match the banner's `const profile`
     scaffolding; the mark carries the colour. Use on anything wider than ~240px;
     below that use the mark alone. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 96" width="520" height="96" role="img" aria-label="jorshimayor">
  <title>jorshimayor</title>
  <defs>
    <linearGradient id="lockGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C1124"/>
      <stop offset="1" stop-color="#101A4D"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="20" fill="url(#lockGlow)"/>
  <rect x="0.75" y="0.75" width="94.5" height="94.5" rx="19.25" fill="none"
        stroke="rgba(93,120,255,0.22)" stroke-width="1.5"/>
{{MARK}}
  <text x="126" y="54" font-family="{{MONO}}"
        font-size="34" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">jorshimayor</text>
  <text x="127" y="76" font-family="{{MONO}}"
        font-size="12.5" fill="#6E7893" letter-spacing="3.4">{{TAGLINE}}</text>
</svg>
